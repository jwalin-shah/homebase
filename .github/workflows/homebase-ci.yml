name: HomeBase CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make prove
      - name: Z3 proofs (optional)
        run: |
          if [ -f verification/z3_proofs.py ]; then
            python3 verification/z3_proofs.py
          else
            echo "verification/z3_proofs.py not present — skipping"
          fi
